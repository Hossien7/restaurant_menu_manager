{% extends 'menu/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5 text-center">
    <h2 style="color:#1565c0;">{{ item.name }}</h2>
    <p>{{ item.description }}</p>
    
    {% if item.image %}
        <img src="{{ item.image.url }}" alt="{{ item.name }}" 
             class="img-fluid rounded shadow" style="max-width:400px;">
    {% endif %}
    
    <div class="mt-3">
        <span class="badge bg-warning text-dark fs-5">
            {{ item.price }} تومان
        </span>
    </div>


    <a href="{% url 'menu:menu' %}" class="btn btn-secondary mt-4">بازگشت به منو</a>
    <a href="{% url 'menu:item_3D_detail' item.id %}" class="btn btn-secondary mt-4">رفتن به حالت سه بعدی</a>
</div>
{% endblock %}
