{%load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}منوی رستوران{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            background: #e3f0ff;
            min-height: 100vh;
        }
        .navbar {
            background: #1976d2;
        }
        .navbar-brand, .navbar-nav .nav-link {
            color: #fff !important;
        }
        footer {
            background: #1976d2;
            color: #fff;
            text-align: center;
            padding: 12px 0;
            margin-top: 40px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">رستوران آبی</a>
        </div>
    </nav>

    <!-- Messages (Django) -->
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} mt-2" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- Main Content -->
    {% block content %}{% endblock %}

    <!-- Footer -->
    <footer>
         رستوران آبی |
        Developed with ❤️ by <a href="https://github.com/Hossien7" style="color: #e3f0ff;">Hossien7</a>
    </footer>
</body>
</html>
